# ---------------------------------------------------------------
# Configuración del backend
# Los valores sensibles NO se escriben aquí: se leen de variables de
# entorno (ver .env.example en la raíz). La sintaxis ${VAR:valor}
# usa "valor" solo cuando la variable no existe.
# ---------------------------------------------------------------
spring.application.name=plantilla-backend
server.port=8080

# --- Base de datos ---
# Dentro de Docker Compose: DB_HOST=db y DB_PORT=5432 (red interna).
# Fuera de Docker: localhost y el puerto publicado (DB_HOST_PORT del .env).
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:${DB_HOST_PORT:5432}}/${POSTGRES_DB:plantilla}
# Sin valor por defecto a propósito: si faltan, el backend no arranca.
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# --- JPA / Hibernate ---
# Hibernate NO crea ni modifica tablas: solo valida que las entidades
# coincidan con el esquema que creó Flyway.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Flyway ---
# Las migraciones están en src/main/resources/db/migration, la ubicación
# por defecto de Flyway (classpath:db/migration), así que no requieren
# configuración. Se aplican automáticamente al arrancar.

# --- CORS ---
# Orígenes del frontend autorizados, separados por comas.
app.cors.origenes-permitidos=${CORS_ORIGENES_PERMITIDOS:http://localhost:5173,http://127.0.0.1:5173}

# --- Swagger UI ---
springdoc.swagger-ui.path=/swagger-ui.html
